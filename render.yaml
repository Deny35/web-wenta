services:
  - type: web
    name: wenta
    runtime: node
    buildCommand: npm install && npm run build --workspace=client
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
