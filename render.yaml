services:
  - type: web
    name: wenta
    runtime: node
    buildCommand: npm install && npm run build --workspace=client
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wenta-db
          property: connectionString

databases:
  - name: wenta-db
    databaseName: wenta
    user: wenta
